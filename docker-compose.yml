services:

  web:
    image: nginx
    restart: unless-stopped
    container_name: web_apti_compose
    ports:
      - "8081:80"
    volumes:
      - ./web:/usr/share/nginx/html
    networks:
      - red_apti_compose

  db:
    image: mysql:8
    restart: unless-stopped
    container_name: db_apti_compose
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - datos_apti_compose:/var/lib/mysql
    networks:
      - red_apti_compose

  adminer:
    image: adminer:latest
    restart: unless-stopped
    container_name: adminer_apti
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - red_apti_compose
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    container_name: portainer_apti
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - red_apti_compose
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    restart: unless-stopped
    container_name: waf_apti
    environment:
      BACKEND: http://web:80
      PARANOIA: 1
    ports:
      - "8083:8080"
    depends_on:
      - web
    networks:
      - red_apti_compose

  backup:
    image: mysql:8
    restart: unless-stopped
    container_name: backup_apti
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          mysqldump -h db -u root --single-transaction "$$MYSQL_DATABASE" > "/backups/$$MYSQL_DATABASE-$$(date +%F_%H%M).sql"
          sleep 86400
        done
    depends_on:
      - db
    networks:
      - red_apti_compose

networks:
  red_apti_compose:

volumes:
  datos_apti_compose:
  portainer_data:
